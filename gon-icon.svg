<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Gon — Go terminal">
  <title>Gon</title>
  <desc>Gon 终端图标：单层终端窗口 + 手绘矢量粗圆体字标</desc>

  <defs>
    <!-- 窗口内部辉光 -->
    <radialGradient id="glowCyan" cx="0.14" cy="0.06" r="0.85">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.40"/>
      <stop offset="0.55" stop-color="#22D3EE" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.90" cy="0.98" r="0.85">
      <stop offset="0" stop-color="#F472B6" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#A855F7" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <!-- 唯一一层边框 -->
    <linearGradient id="winEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DF9FF" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#60A5FA" stop-opacity="0.55"/>
      <stop offset="0.70" stop-color="#C084FC" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#FB7185" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="winGrad" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#0F1B33"/>
      <stop offset="1" stop-color="#05070E"/>
    </linearGradient>
    <linearGradient id="topLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="1" fill="#9FE8FF" opacity="0.05"/>
    </pattern>

    <!-- 字标渐变：userSpaceOnUse，跨整个 Gon 一条连续水平光带 -->
    <linearGradient id="wordGrad" gradientUnits="userSpaceOnUse"
                    x1="41" y1="264" x2="469" y2="264">
      <stop offset="0.00" stop-color="#00E5FF"/>
      <stop offset="0.17" stop-color="#38BDF8"/>
      <stop offset="0.34" stop-color="#6366F1"/>
      <stop offset="0.52" stop-color="#A855F7"/>
      <stop offset="0.70" stop-color="#E879F9"/>
      <stop offset="0.87" stop-color="#F472B6"/>
      <stop offset="1.00" stop-color="#FB7185"/>
    </linearGradient>

    <!-- 掠过式高光 -->
    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="-160" y1="0" x2="-40" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.52" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
      <animate attributeName="x1" values="-160;520" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-40;640" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="lineGrad" gradientUnits="userSpaceOnUse"
                    x1="132" y1="438" x2="380" y2="438">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.10"/>
      <stop offset="0.18" stop-color="#22D3EE"/>
      <stop offset="0.55" stop-color="#A78BFA"/>
      <stop offset="0.85" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#FDBA74"/>
    </linearGradient>

    <filter id="blur18" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="dotGlow" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <clipPath id="winClip"><rect x="16" y="16" width="480" height="480" rx="96"/></clipPath>

    <!-- 手绘矢量字标：直立粗圆体（圆头笔画），不依赖任何系统字体 -->
    <g id="mark" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- G：约 305° 圆环 + 内伸横杠，开口留在右上 -->
      <path d="M 150.1 218.1 A 56 56 0 1 0 174 264 L 118 264"/>
      <!-- o -->
      <path d="M 225 274 A 47 47 0 1 1 319 274 A 47 47 0 1 1 225 274"/>
      <!-- n：双竖干 + 顶部半圆拱；竖干收短半个笔画宽，圆头恰好落在基线上 -->
      <path d="M 372 321 L 372 265 A 38 38 0 0 1 448 265 L 448 321"/>
    </g>
  </defs>

  <!-- 唯一的窗口（同时是图标外轮廓） -->
  <rect x="16" y="16" width="480" height="480" rx="96"
        fill="url(#winGrad)" stroke="url(#winEdge)" stroke-width="2.5"/>

  <g clip-path="url(#winClip)">
    <rect x="16" y="16" width="480" height="480" fill="url(#glowCyan)"/>
    <rect x="16" y="16" width="480" height="480" fill="url(#glowPink)"/>
    <rect x="16" y="16" width="480" height="200" fill="url(#topLight)"/>
    <rect x="16" y="16" width="480" height="480" fill="url(#scan)"/>
  </g>

  <!-- 标题栏 -->
  <circle cx="72" cy="72" r="8.5" fill="#FF5F57"/>
  <circle cx="104" cy="72" r="8.5" fill="#FEBC2E"/>
  <circle cx="136" cy="72" r="8.5" fill="#28C840"/>
  <line x1="16" y1="112" x2="496" y2="112" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1.5"/>

  <!-- 提示符 + 闪烁光标 -->
  <text x="62" y="182" font-family="'Cascadia Code',Consolas,ui-monospace,monospace"
        font-size="40" font-weight="700" fill="#22D3EE">&gt;</text>
  <rect x="100" y="152" width="18" height="36" rx="5" fill="#22D3EE" filter="url(#dotGlow)" opacity="0.9"/>
  <rect x="100" y="152" width="18" height="36" rx="5" fill="#22D3EE">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1"
             dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- 字标：直立粗圆体，按包围盒居中 -->
  <g transform="translate(256 330) scale(0.82) translate(-255 -264.5)">
    <g stroke-width="42">
      <use href="#mark" stroke="url(#wordGrad)" filter="url(#blur18)" opacity="0.85"/>
      <use href="#mark" stroke="url(#wordGrad)"/>
      <use href="#mark" stroke="url(#sheen)" opacity="0.9"/>
    </g>
  </g>

  <!-- 底部光束 -->
  <line x1="132" y1="438" x2="380" y2="438" stroke="url(#lineGrad)"
        stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="380" cy="438" r="6" fill="#FB7185" filter="url(#dotGlow)"/>
  <circle cx="380" cy="438" r="4" fill="#FFE4D6"/>
</svg>
